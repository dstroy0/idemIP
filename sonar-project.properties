sonar.projectKey=dstroy0_idemIP
sonar.organization=dstroy0

sonar.sourceEncoding=UTF-8

# What is analysed. tools/ and cmake/ are build scaffolding, not the library or its measurement.
sonar.sources=src,test

# test/unit/<area>/<suite>/unity_runner.c is written by Unity's own generate_test_runner.rb on every
# build, from the case names in the suite beside it. Nobody edits one, and nothing is decided in
# one: a finding there names a line the generator will rewrite. The three empty setUp/tearDown/
# resetTest bodies it emits per suite were most of what the analysis reported.
sonar.exclusions=**/unity_runner.c

# test/ is the instrument, not the thing measured. gcovr already filters the report to src/, and
# this keeps the analyser from reading a suite's own uncovered lines back as a coverage gap.
sonar.coverage.exclusions=test/**

# A suite is a list of cases with no branching, so its duplication is the shape of the borrow
# declarations and the arm/canary preamble every one of the 54 repeats, not copied logic.
sonar.cpd.exclusions=test/**
