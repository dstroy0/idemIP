name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Analyze
    runs-on: ubuntu-latest
    env:
      # An absolute path, so the scanner resolves the compilation database from whatever directory
      # it runs in. github.workspace and not runner.temp: the runner context does not exist when a
      # job's env is evaluated, and naming it there is what makes the whole file fail to parse.
      # sonar.sources is src,test, so a build directory inside the workspace is not analysed.
      BUILD_DIR: ${{ github.workspace }}/build-cov
      # At the job, not on the scan step, because the scan step has to be able to ASK whether it is
      # set. The secrets context is not readable from an `if:`; the env context is.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          submodules: true # include/MMgr, which this tree tracks as a commit and not as files

      - name: Install Ninja and gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install gcovr

      # IDEMIP_COVERAGE instruments every translation unit and forces the build type to Debug, so
      # the Release -Os and the LTO that folds the namespace indirection are both off: one source
      # line stays one branch, which is what makes the count mean anything. CMAKE_EXPORT_COMPILE_
      # COMMANDS is already ON in CMakeLists.txt, so this writes the compilation database the C
      # analyser needs in the same step.
      - name: Configure
        run: cmake -S . -B "$BUILD_DIR" -G Ninja -DIDEMIP_COVERAGE=ON

      - name: Build
        run: cmake --build "$BUILD_DIR"

      # The gcda counts do not exist until the instrumented binaries have run, so the analysis
      # measures what the suites actually reached. A failing suite fails the job before any report
      # is uploaded, which keeps a green coverage number from standing on a red run.
      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --timeout 120

      # gcovr's --sonarqube writes the generic format sonar.coverageReportPaths reads. --root is the
      # repository, so every path in the report is the one the analyser resolves against, and
      # --filter keeps it to the library: test/ is the measuring instrument, not the measured thing.
      - name: Collect coverage
        run: gcovr --root . --filter 'src/' --sonarqube coverage.xml --print-summary "$BUILD_DIR"

      # Only when there is a token to scan with. GitHub does not hand repository Actions secrets to a
      # workflow a Dependabot pull request triggered - Dependabot has its own secret store, under
      # Settings -> Secrets and variables -> Dependabot - so secrets.SONAR_TOKEN resolves to the
      # empty string there and the scanner answers "Not authorized or project not found", exit 3.
      # That is a red run saying the analysis broke, when what happened is that there was nothing to
      # analyse with. The same is true of a pull request from a fork.
      #
      # Everything above this step still runs on those pull requests, which is the part that has
      # something to say about them: the coverage build is the one configuration no other workflow
      # builds, and the suites run against it.
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            --define sonar.cfamily.compile-commands=${{ env.BUILD_DIR }}/compile_commands.json
            --define sonar.coverageReportPaths=coverage.xml

      # A skipped step is invisible in the run summary, and a green SonarQube job that analysed
      # nothing reads exactly like one that did. This says which happened.
      - name: Report the scan as not run
        if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarQube analysis skipped::SONAR_TOKEN is empty, so nothing was analysed. A Dependabot or fork pull request does not receive repository Actions secrets; the build and the suites above did run. To analyse Dependabot's own pull requests, add SONAR_TOKEN under Settings, Secrets and variables, Dependabot."
