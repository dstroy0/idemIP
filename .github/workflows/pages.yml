# The docs page, served.
#
# Pages on this repository is set to the `workflow` build type, which means GitHub serves whatever a
# workflow hands it and serves nothing at all until one does. docs/index.html sat on main reachable
# only as source. This is the workflow that hands it over.
#
# The artifact is docs/, not the repository root, so the page is the site root rather than
# /docs/, and docs/learn/RFC goes up with it - every RFC chip on the page links to the text beside
# it, and those links are relative.
#
# Nothing here checks that the page is current. docsgen.py --check answers that, and it needs
# idemip_sizes built to answer it, which is a compiler and not a copy. A stale page deploys.
name: pages

on:
  push:
    branches:
      - main
    # Only what is served, plus this file. A src/ change cannot alter the artifact without the
    # generated regions being rewritten into docs/, which is a docs/ change.
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # So a deploy can be re-run without an empty commit to cause it.
  workflow_dispatch:

# GITHUB_TOKEN gets read of the tree, write to Pages, and an OIDC token, which is what
# deploy-pages authenticates the upload with. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a running one is left alone: cancelling mid-deploy is how a site ends up
# serving half of two versions.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true # include/MMgr, which this tree tracks as a commit and not as files

      - name: Upload docs/ as the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
